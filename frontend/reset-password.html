<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — ELI6 Movies</title>
  <script>
    (function(){
      try { var p=JSON.parse(localStorage.getItem('eli6.prefs')||'{}'); document.documentElement.dataset.theme=p.theme||'pulse'; document.documentElement.dataset.mode=p.mode||'dark'; }
      catch(e){ document.documentElement.dataset.theme='pulse'; document.documentElement.dataset.mode='dark'; }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/design.css" />
  <style>
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; }
    .auth-logo { font-size: 22px; font-weight: 800; color: var(--fg); margin-bottom: 28px; }
    .auth-logo span { color: var(--accent); }
    .auth-title { font-size: 22px; font-weight: 700; color: var(--fg); margin: 0 0 8px; }
    .auth-sub { font-size: 14px; color: var(--fg-muted); margin: 0 0 28px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--fg); }
    .field input { background: var(--surface2,#1e1e24); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--fg); font-size: 14px; outline: none; }
    .field input:focus { border-color: var(--accent); }
    .field-hint { font-size: 12px; color: var(--fg-muted); }
    .btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .msg { font-size: 13px; padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .msg.success { background: rgba(0,184,148,.15); color: #00b894; border: 1px solid rgba(0,184,148,.3); }
    .msg.error   { background: rgba(225,112,85,.15);  color: #e17055; border: 1px solid rgba(225,112,85,.3); }
    .back-link { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: var(--fg-muted); text-decoration: none; }
    .back-link:hover { color: var(--fg); }
    #invalid-token { text-align: center; padding: 40px 0; }
    #invalid-token .icon { font-size: 2rem; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card" id="card">
      <div class="auth-logo">ELI<span>6</span>.</div>
      <div id="invalid-token" style="display:none">
        <div class="icon">⚠</div>
        <div style="font-weight:600;color:var(--fg);margin-bottom:8px">Invalid or expired link</div>
        <div style="font-size:13px;color:var(--fg-muted);margin-bottom:24px">This reset link has expired or already been used.</div>
        <a href="forgot-password.html" style="background:var(--accent);color:#fff;padding:10px 22px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px">Request a new link</a>
      </div>
      <div id="form-wrap">
        <h1 class="auth-title">Set new password</h1>
        <p class="auth-sub">Choose a strong password for your account.</p>
        <div id="msg" class="msg"></div>
        <form id="form">
          <div class="field">
            <label for="pwd">New password</label>
            <input type="password" id="pwd" placeholder="Min 8 characters" autocomplete="new-password" required />
            <span class="field-hint">Must include at least one letter and one number or symbol.</span>
          </div>
          <div class="field">
            <label for="pwd2">Confirm password</label>
            <input type="password" id="pwd2" placeholder="Repeat your new password" autocomplete="new-password" required />
          </div>
          <button type="submit" class="btn-primary" id="btn">Set new password</button>
        </form>
      </div>
      <a href="account.html" class="back-link">← Back to sign in</a>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script>
    const API = (window.API_BASE_URL || 'https://eli6movies.onrender.com/api').replace(/\/+$/, '');
    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      document.getElementById('form-wrap').style.display = 'none';
      document.getElementById('invalid-token').style.display = 'block';
    }

    const form = document.getElementById('form');
    const btn  = document.getElementById('btn');
    const msg  = document.getElementById('msg');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + type;
      msg.style.display = 'block';
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const pwd  = document.getElementById('pwd').value;
      const pwd2 = document.getElementById('pwd2').value;
      if (pwd !== pwd2) { showMsg('Passwords do not match.', 'error'); return; }
      if (pwd.length < 8) { showMsg('Password must be at least 8 characters.', 'error'); return; }

      btn.disabled = true;
      btn.textContent = 'Updating…';
      msg.style.display = 'none';
      try {
        const r = await fetch(API + '/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: pwd }),
        });
        const d = await r.json();
        if (!r.ok) {
          const errs = { TOKEN_INVALID_OR_EXPIRED: 'This link has expired. Please request a new one.', INVALID_INPUT: 'Password must be at least 8 characters with a letter and number/symbol.' };
          showMsg(errs[d.error] || 'Failed to reset password.', 'error');
          if (d.error === 'TOKEN_INVALID_OR_EXPIRED') {
            document.getElementById('form-wrap').style.display = 'none';
            document.getElementById('invalid-token').style.display = 'block';
          }
        } else {
          document.getElementById('form-wrap').innerHTML = `
            <div style="text-align:center;padding:20px 0">
              <div style="font-size:2rem;margin-bottom:12px">✓</div>
              <div style="font-weight:600;color:var(--fg);margin-bottom:8px">Password updated!</div>
              <div style="font-size:13px;color:var(--fg-muted);margin-bottom:24px">You can now sign in with your new password.</div>
              <a href="account.html" style="background:var(--accent);color:#fff;padding:10px 22px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px">Sign in</a>
            </div>`;
        }
      } catch (_) {
        showMsg('Something went wrong. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Set new password';
      }
    });
  </script>
</body>
</html>
