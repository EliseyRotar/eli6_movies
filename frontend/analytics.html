<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Analytics — eli6movies</title>
<script src="js/config.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0e;--surface:#13131a;--surface2:#1c1c26;--surface3:#242432;
  --border:#2a2a3a;--border2:#353548;
  --accent:#7c6ff7;--accent2:#00cec9;--accent3:#fd79a8;
  --green:#00b894;--red:#e17055;--yellow:#fdcb6e;--orange:#e67e22;
  --text:#eaeaf8;--muted:#8888aa;--muted2:#55556a;
  --radius:12px;--radius-sm:8px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;font-size:14px}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── Nav ── */
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:rgba(10,10,14,.92);backdrop-filter:blur(12px);position:sticky;top:0;z-index:200;gap:12px;flex-wrap:wrap}
.nav-brand{font-size:.95rem;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.nav-brand span{color:var(--muted)}
.nav-center{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.range-tabs{display:flex;background:var(--surface2);border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border)}
.range-tabs button{background:none;border:none;color:var(--muted);padding:6px 13px;cursor:pointer;font-size:.78rem;font-weight:600;transition:all .15s}
.range-tabs button.active{background:var(--accent);color:#fff}
.nav-actions{display:flex;gap:8px;align-items:center}
.btn-icon{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:.78rem;font-weight:600;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn-icon:hover{color:var(--text);border-color:var(--muted2)}
.btn-icon.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.refresh-countdown{font-size:.72rem;color:var(--muted2);white-space:nowrap}

/* ── Section nav ── */
.section-nav{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:53px;z-index:100;padding:0 24px}
.section-nav::-webkit-scrollbar{height:0}
.snav-btn{background:none;border:none;color:var(--muted);padding:10px 16px;cursor:pointer;font-size:.78rem;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.snav-btn:hover{color:var(--text)}
.snav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── Main layout ── */
.main{max-width:1600px;margin:0 auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px}

/* ── Live Bar ── */
.live-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(0,184,148,.6);animation:pulse 1.8s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,184,148,.6)}50%{box-shadow:0 0 0 8px rgba(0,184,148,0)}}
.live-text{font-size:.9rem;font-weight:600}
.live-text em{font-style:normal}
.live-sessions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.live-chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:.72rem;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.live-chip.user{border-color:var(--accent);color:var(--accent)}
.live-updated{font-size:.68rem;color:var(--muted2);white-space:nowrap}

/* ── Section header ── */
.section-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── KPI grid ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;transition:border-color .2s}
.kpi-card:hover{border-color:var(--border2)}
.kpi-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.kpi-value{font-size:1.9rem;font-weight:800;line-height:1.1;color:var(--text)}
.kpi-sub{font-size:.72rem;color:var(--muted)}
.kpi-trend{font-size:.72rem;font-weight:700;display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;margin-top:2px;width:fit-content}
.kpi-trend.up{background:rgba(0,184,148,.12);color:var(--green)}
.kpi-trend.down{background:rgba(225,112,85,.12);color:var(--red)}
.kpi-trend.neutral{background:rgba(136,136,170,.1);color:var(--muted)}
.kpi-card.accent .kpi-value{color:var(--accent)}
.kpi-card.green .kpi-value{color:var(--green)}
.kpi-card.teal .kpi-value{color:var(--accent2)}
.kpi-card.pink .kpi-value{color:var(--accent3)}
.kpi-card.yellow .kpi-value{color:var(--yellow)}
.kpi-shine{position:absolute;top:0;right:0;width:60px;height:60px;opacity:.06;border-radius:50%;transform:translate(20px,-20px)}

/* ── Chart cards ── */
.chart-row{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:900px){.chart-row{grid-template-columns:1fr}}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px;flex-wrap:wrap}
.chart-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.chart-toggles{display:flex;gap:6px}
.chart-toggle{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.72rem;font-weight:600;transition:all .15s}
.chart-toggle.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chart-wrap{position:relative;height:180px}
.chart-wrap.tall{height:220px}

/* ── 3-col audience ── */
.audience-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:1100px){.audience-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.audience-grid{grid-template-columns:1fr}}

/* ── List card ── */
.list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.list-card .rows{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.list-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;font-size:.8rem;cursor:default}
.list-row:hover{background:var(--surface2)}
.list-row-num{color:var(--muted2);font-size:.68rem;font-weight:700;width:16px;text-align:right;flex-shrink:0}
.list-row-key{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.list-row-bar{flex:1;height:3px;background:var(--surface3);border-radius:2px;overflow:hidden;min-width:24px}
.list-row-fill{height:100%;border-radius:2px;transition:width .4s ease}
.list-row-val{color:var(--muted);font-weight:700;flex-shrink:0;font-size:.78rem}
.list-row-sub{color:var(--muted2);font-size:.68rem;flex-shrink:0}
.flag{margin-right:4px;font-size:.9rem}

/* ── Donut charts ── */
.donut-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.donut-wrap{height:140px;position:relative}
.donut-label{font-size:.72rem;color:var(--muted);text-align:center;margin-top:6px;font-weight:600}

/* ── Heatmap ── */
.heatmap-wrap{margin-top:10px;height:120px;position:relative}

/* ── 2-col acquisition ── */
.acq-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}
@media(max-width:900px){.acq-grid{grid-template-columns:1fr}}

/* ── Table card ── */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;overflow:hidden}
.table-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.table-head-left{display:flex;align-items:center;gap:10px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{text-align:left;padding:9px 10px;color:var(--muted);font-weight:600;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(42,42,58,.5);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:.68rem;font-weight:700}
.badge.login{background:rgba(124,111,247,.15);color:var(--accent)}
.badge.register{background:rgba(0,184,148,.15);color:var(--green)}
.badge.mobile{background:rgba(253,203,110,.1);color:var(--yellow)}
.badge.desktop{background:rgba(0,206,201,.1);color:var(--accent2)}
.badge.tablet{background:rgba(225,112,85,.1);color:var(--red)}
.badge.user-row{background:rgba(124,111,247,.1);color:var(--accent);border:1px solid rgba(124,111,247,.3)}
.path-cell{font-family:monospace;color:var(--accent2);font-size:.75rem}
.ip-cell{font-family:monospace;color:var(--muted);font-size:.72rem}
.time-cell{color:var(--muted);white-space:nowrap;font-size:.72rem}
.dur-cell{color:var(--muted2);font-size:.72rem}

/* ── Tab bar ── */
.tab-bar{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.tab{background:none;border:none;color:var(--muted);padding:8px 14px;cursor:pointer;font-size:.8rem;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── Search bar ── */
.search-bar{display:flex;align-items:center;gap:8px}
.search-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:var(--radius-sm);font-size:.78rem;width:200px;outline:none}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted2)}

/* ── UTM Builder ── */
.utm-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.utm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.utm-field{display:flex;flex-direction:column;gap:5px}
.utm-field label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.utm-field input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:var(--radius-sm);font-size:.8rem;outline:none;transition:border-color .15s}
.utm-field input:focus{border-color:var(--accent)}
.utm-field input::placeholder{color:var(--muted2)}
.utm-url-row{margin-top:12px;display:flex;gap:8px}
.utm-url-box{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--accent2);padding:8px 12px;border-radius:var(--radius-sm);font-size:.75rem;font-family:monospace;word-break:break-all;min-height:36px;cursor:text}
.utm-copy-btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:.78rem;font-weight:700;white-space:nowrap;flex-shrink:0;transition:opacity .15s}
.utm-copy-btn:hover{opacity:.85}
.utm-base-row{margin-bottom:4px}

/* ── Loader / Error ── */
.loader{display:flex;align-items:center;justify-content:center;padding:80px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:20px 8px;font-size:.78rem;color:var(--muted)}

/* ── Auto-refresh pill ── */
.refresh-pill{font-size:.68rem;color:var(--green);background:rgba(0,184,148,.1);border:1px solid rgba(0,184,148,.25);padding:3px 9px;border-radius:20px;white-space:nowrap}

/* ── Export btn ── */
.export-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 11px;border-radius:var(--radius-sm);cursor:pointer;font-size:.75rem;font-weight:600;transition:all .15s;display:flex;align-items:center;gap:4px}
.export-btn:hover{color:var(--text);border-color:var(--muted2)}

/* ── Offline banner ── */
.offline-banner{background:var(--red);color:#fff;padding:8px 24px;font-size:.82rem;font-weight:600;text-align:center;position:sticky;top:97px;z-index:99;border-radius:0}

@media(max-width:600px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.nav{padding:10px 14px}.main{padding:14px}.section-nav{top:48px}}
</style>
</head>
<body>

<!-- Nav -->
<nav class="nav">
  <a class="nav-brand" href="index.html">← <span>eli6movies</span> / Analytics</a>
  <div class="nav-center">
    <div class="range-tabs" id="rangeTabs">
      <button data-range="1d">24h</button>
      <button data-range="7d" class="active">7d</button>
      <button data-range="30d">30d</button>
      <button data-range="all">All</button>
    </div>
    <span class="refresh-countdown" id="refreshCountdown"></span>
  </div>
  <div class="nav-actions">
    <button class="btn-icon" id="autoRefreshBtn" title="Toggle auto-refresh">⟳ Auto</button>
    <button class="export-btn" id="exportBtn" title="Export recent activity as CSV">⬇ CSV</button>
  </div>
</nav>

<!-- Section nav -->
<nav class="section-nav">
  <button class="snav-btn active" data-section="overview">Overview</button>
  <button class="snav-btn" data-section="audience">Audience</button>
  <button class="snav-btn" data-section="acquisition">Acquisition</button>
  <button class="snav-btn" data-section="content">Content</button>
  <button class="snav-btn" data-section="activity">Activity</button>
  <button class="snav-btn" data-section="utm">UTM Builder</button>
  <button class="snav-btn" data-section="users">Users</button>
</nav>

<div class="main" id="app">
  <div class="loader"><div class="spinner"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script>
'use strict';

const API = (window.API_BASE_URL || 'https://eli6movies.onrender.com/api').replace(/\/+$/, '');
let currentRange = '7d';
let autoRefresh = true;
let refreshTimer = null;
let refreshSecs = 30;
let charts = {};
let recentData = [];
let mainChartMode = 'line';
let mainChartDataset = 'all'; // 'all' | 'views' | 'uniq' | 'dur'

// ── Helpers ──────────────────────────────────────────────────
function fmt(n)  { return Number(n||0).toLocaleString(); }
function esc(s)  { if(!s) return '—'; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(iso){ return new Date(iso).toLocaleString(); }
function timeAgo(iso){
  const s = Math.round((Date.now()-new Date(iso))/1000);
  if(s<60)   return s+'s ago';
  if(s<3600) return Math.round(s/60)+'m ago';
  if(s<86400)return Math.round(s/3600)+'h ago';
  return new Date(iso).toLocaleDateString();
}
function fmtDur(s){
  if(!s||s<=0) return '—';
  s=Math.round(s);
  if(s<60) return s+'s';
  return Math.floor(s/60)+'m '+(s%60)+'s';
}
function countryFlag(code){
  if(!code||code==='LO') return '🖥️';
  try{return code.toUpperCase().replace(/./g,c=>String.fromCodePoint(0x1F1E6-65+c.charCodeAt(0)));}catch(_){return ''}
}
function trendHtml(curr, prev){
  if(prev==null) return '';
  if(prev===0) return curr>0?'<span class="kpi-trend up">↑ new</span>':'';
  const pct=Math.round(((curr-prev)/prev)*100);
  if(pct===0) return '<span class="kpi-trend neutral">→ 0%</span>';
  return pct>0
    ? `<span class="kpi-trend up">↑ ${pct}%</span>`
    : `<span class="kpi-trend down">↓ ${Math.abs(pct)}%</span>`;
}
function fetchWithTimeout(url,opts,ms){
  const ctrl=new AbortController();
  const tid=setTimeout(()=>ctrl.abort(),ms);
  return fetch(url,{...opts,signal:ctrl.signal}).finally(()=>clearTimeout(tid));
}
async function api(path){
  const r=await fetchWithTimeout(API+path,{credentials:'include'},15000);
  if(r.status===429){
    const retryAfter=parseInt(r.headers.get('Retry-After')||'60',10);
    const e=new Error('RATE_LIMITED');e.retryAfter=retryAfter;throw e;
  }
  if(!r.ok) throw new Error('API error '+r.status);
  return r.json();
}
function destroyChart(key){
  if(charts[key]){charts[key].destroy();delete charts[key];}
}

// ── Auth ─────────────────────────────────────────────────────
function showWaking(n){
  document.getElementById('app').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:20px;color:var(--muted);text-align:center">
      <div class="spinner"></div>
      <div style="font-size:1rem;font-weight:600;color:var(--text)">Backend starting up…</div>
      <div style="font-size:.82rem">Render free tier sleeps after 15 min of inactivity.<br>This takes up to 30 seconds.</div>
      <div style="font-size:.72rem;opacity:.55">Attempt ${n}…</div>
    </div>`;
}
async function checkAuth(){
  for(let i=1;i<=6;i++){
    showWaking(i);
    try{
      const r=await fetchWithTimeout(API+'/user/profile',{credentials:'include'},25000);
      if(r.status===401||r.status===403){location.href='account.html';return false;}
      if(!r.ok) throw new Error('server error');
      const u=await r.json();
      if(u.role!=='admin'){location.href='index.html';return false;}
      return true;
    }catch(_){
      if(i<6) await new Promise(r=>setTimeout(r,3000));
    }
  }
  document.getElementById('app').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;color:var(--muted);text-align:center;padding:40px">
      <div style="font-size:2rem">⚠</div>
      <div style="font-size:1rem;font-weight:600;color:var(--text)">Backend unavailable</div>
      <div style="font-size:.82rem;max-width:360px">The server didn't respond after 6 attempts.</div>
      <div style="display:flex;gap:12px;margin-top:8px">
        <button onclick="location.reload()" style="background:var(--accent);color:#fff;border:none;padding:10px 22px;border-radius:8px;cursor:pointer;font-weight:600">Retry</button>
        <a href="index.html" style="background:none;color:var(--muted);border:1px solid var(--border);padding:10px 22px;border-radius:8px;text-decoration:none;font-weight:600">Home</a>
      </div>
    </div>`;
  return false;
}

// ── Live bar ─────────────────────────────────────────────────
async function refreshLive(){
  try{
    const d=await api('/admin/analytics/live');
    const bar=document.getElementById('liveBar');
    if(!bar) return;
    const el=document.getElementById('statLive');
    if(el) el.textContent=d.total;
    const chips=d.sessions.slice(0,6).map(s=>{
      const who=s.username
        ?`<span class="live-chip user">👤 ${esc(s.username)}</span>`
        :`<span class="live-chip">👁 anon</span>`;
      return `${who}<span style="color:var(--muted2);font-size:.68rem">${esc(s.path)}</span>`;
    }).join('');
    bar.innerHTML=`
      <div class="live-dot"></div>
      <div class="live-text"><em style="color:var(--green)">${d.total}</em> online —
        <em style="color:var(--accent)">${d.loggedIn}</em> logged in,
        <em style="color:var(--muted)">${d.anon}</em> anon
      </div>
      <div class="live-sessions">${chips}</div>
      <span class="live-updated">↻ ${new Date().toLocaleTimeString()}</span>`;
  }catch(_){}
}

// ── Overview / KPI ───────────────────────────────────────────
async function loadOverview(){
  const d=await api('/admin/analytics/overview?range='+currentRange);
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.innerHTML=v;};
  set('statTotal',  fmt(d.total));
  set('statPeriod', fmt(d.period));
  set('statToday',  fmt(d.today));
  set('statUniq',   fmt(d.uniqueSessions));
  set('statUsers',  fmt(d.uniqueUsers));
  set('statDur',    fmtDur(d.avgDuration));
  set('statBounce', d.bounceRate!=null ? d.bounceRate+'%' : '—');
  set('statNewUsers',fmt(d.newUsers||0));

  set('trendPeriod', trendHtml(d.period, d.prevPeriod));
  set('trendUniq',   trendHtml(d.uniqueSessions, d.prevUnique));
  set('trendNewUsers',trendHtml(d.newUsers||0, d.prevNewUsers||0));
}

// ── Main chart ───────────────────────────────────────────────
async function loadChart(){
  const data=await api('/admin/analytics/daily?range='+currentRange);
  const labels=data.map(d=>{

// ── Donut charts ─────────────────────────────────────────────
function makeDonut(ctxId,key,data,colorSet){
  const ctx=document.getElementById(ctxId);
  if(!ctx) return;
  destroyChart(key);
  if(!data.length){ctx.parentElement.innerHTML='<div class="empty" style="padding:12px">No data</div>';return;}
  charts[key]=new Chart(ctx,{
    type:'doughnut',
    data:{labels:data.map(d=>d._id||'?'),datasets:[{data:data.map(d=>d.count),backgroundColor:colorSet,borderWidth:0,hoverOffset:4}]},
    options:{
      responsive:true,maintainAspectRatio:false,cutout:'68%',
      plugins:{legend:{position:'right',labels:{color:'#8888aa',font:{size:10},padding:8,usePointStyle:true,boxWidth:8}}},
    },
  });
}
const DEVICE_COLORS=['#7c6ff7','#00cec9','#fd79a8','#fdcb6e','#e17055'];
const OS_COLORS=['#00b894','#7c6ff7','#e17055','#00cec9','#fd79a8','#fdcb6e'];

// ── Bar lists ────────────────────────────────────────────────
function renderList(containerId,rows,keyFn,maxVal,subFn){
  const el=document.getElementById(containerId);
  if(!el) return;
  if(!rows.length){el.innerHTML='<div class="empty">No data yet</div>';return;}
  el.innerHTML=rows.map((r,i)=>{
    const pct=maxVal?Math.round((r.count/maxVal)*100):0;
    const sub=subFn?subFn(r):'';
    return `<div class="list-row">
      <span class="list-row-num">${i+1}</span>
      <span class="list-row-key">${keyFn(r)}</span>
      <div class="list-row-bar"><div class="list-row-fill" style="width:${pct}%;background:var(--accent)"></div></div>
      <span class="list-row-val">${fmt(r.count)}</span>
      ${sub?`<span class="list-row-sub">${sub}</span>`:''}
    </div>`;
  }).join('');
}

    api('/admin/analytics/countries?range='+currentRange),
    api('/admin/analytics/cities?range='+currentRange),
    api('/admin/analytics/devices?range='+currentRange),
    api('/admin/analytics/browsers?range='+currentRange),
    api('/admin/analytics/os?range='+currentRange),
    api('/admin/analytics/referrers?range='+currentRange),
    api('/admin/analytics/campaigns?range=all'),
  ]);

  renderList('listPages', pages,
    r=>`<span class="path-cell">${esc(r._id)}</span>`,
    pages[0]?.count||1,
    r=>r.avgDur>0?`⏱ ${fmtDur(r.avgDur)}`:'');

  renderList('listCountry', countries,
    r=>`<span>${countryFlag(r._id.code)} ${esc(r._id.country)}</span>`,
    countries[0]?.count||1);

    r=>`<span>${countryFlag(r._id.code)} ${esc(r._id.city)}, ${esc(r._id.country)}</span>`,
    cities[0]?.count||1);

async function loadRecent(){

function renderRecentTable(data){
  const tbody=document.getElementById('recentBody');
  if(!tbody) return;
  if(!data.length){tbody.innerHTML='<tr><td colspan="9" class="empty">No data</td></tr>';return;}
  tbody.innerHTML=data.map(r=>{
    // IP cell: show IP + ISP as subtitle
    const ispStr = r.isp ? r.isp.replace(/^AS\d+\s*/,'') : '';
    const ipCell = `<div class="ip-cell" title="${esc(r.isp||r.ip||'')}">${esc(r.ip)||'—'}${ispStr?`<br><span style="color:var(--muted2);font-size:.65rem;font-weight:400">${esc(ispStr)}</span>`:''}</div>`;
    // Country cell: flag + country + city as subtitle
    const locCell = r.country
      ? `<span title="${esc(r.city?r.city+', ':'')}${esc(r.country)}">${countryFlag(r.countryCode)} ${esc(r.country)}${r.city?`<br><span style="color:var(--muted2);font-size:.65rem">${esc(r.city)}</span>`:''}</span>`
      : '—';
    // Referrer: only show external referrers
    const refCell = r.referrer
      ? `<a href="https://${esc(r.referrer)}" target="_blank" rel="noopener" style="color:var(--accent2)">${esc(r.referrer)}</a>`
      : '<span style="color:var(--muted2);font-size:.68rem">direct</span>';
    return `<tr>
      <td>${ipCell}</td>
      <td>${r.username?`<span class="badge user-row">${esc(r.username)}</span>`:'<span style="color:var(--muted)">anon</span>'}</td>
      <td class="path-cell">${esc(r.path)}</td>
      <td>${locCell}</td>
      <td>${esc(r.browser)} / ${esc(r.os)}</td>
      <td><span class="badge ${esc(r.device)}">${esc(r.device)}</span></td>
      <td>${refCell}</td>
      <td class="dur-cell">${fmtDur(r.duration)}</td>
      <td class="time-cell">${timeAgo(r.createdAt)}</td>
    </tr>`;
  }).join('');
}

// ── Search filter for recent table ───────────────────────────
function filterRecent(q){
  if(!q.trim()){renderRecentTable(recentData);return;}
  const lq=q.toLowerCase();
  renderRecentTable(recentData.filter(r=>
    (r.ip||'').includes(lq)||
    (r.username||'').toLowerCase().includes(lq)||
    (r.path||'').toLowerCase().includes(lq)||
    (r.country||'').toLowerCase().includes(lq)||
    (r.browser||'').toLowerCase().includes(lq)
  ));
}

// ── CSV export ───────────────────────────────────────────────
function exportCSV(){
  if(!recentData.length){alert('Load the Activity tab first, then export.');return;}
  const headers=['IP','ISP','User','Page','Country','City','Browser','OS','Device','Referrer','Duration(s)','Time'];
  const rows=recentData.map(r=>[
    r.ip||'',r.isp||'',r.username||'',r.path||'',
    r.country||'',r.city||'',r.browser||'',r.os||'',r.device||'',
    r.referrer||'',r.duration||'',r.createdAt||''
  ].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','));
  const csv=[headers.join(','),...rows].join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='eli6movies-analytics-'+currentRange+'.csv';
  a.click();
}

// ── Load all data ────────────────────────────────────────────
async function loadAll(){
  try{
    await Promise.all([loadOverview(),loadChart(),loadUserGrowth(),loadLists(),loadHourly(),loadRecent(),loadAuthLog()]);
    const b=document.getElementById('offlineBanner');
    if(b) b.remove();
  }catch(e){
    let msg,color;
    if(e.message==='RATE_LIMITED'){
      const secs=e.retryAfter||60;
      msg=`⏱ Rate limited — too many requests. Retry in ${secs}s.`;
      color='var(--yellow)';
      // pause auto-refresh until window resets
      if(autoRefresh){
        clearInterval(refreshTimer);
        refreshSecs=secs;
        setTimeout(()=>{if(autoRefresh)startRefreshTimer();},secs*1000);
        const el=document.getElementById('refreshCountdown');
        if(el) el.textContent='⏱ '+secs+'s';
      }
    } else {
      msg='⚠ Backend offline — data may be stale. Retrying…';
      color='var(--red)';
    }
    let b=document.getElementById('offlineBanner');
    if(!b){
      b=document.createElement('div');
      b.id='offlineBanner';
      b.className='offline-banner';
      document.querySelector('.main')?.prepend(b);
    }
    b.style.background=color;
    b.textContent=msg;
  }
}

// ── Auto-refresh ─────────────────────────────────────────────
function startRefreshTimer(){
  clearInterval(refreshTimer);
  refreshSecs=30;
  updateCountdown();
  refreshTimer=setInterval(async()=>{
    refreshSecs--;
    updateCountdown();
    if(refreshSecs<=0){
      refreshSecs=30;
      await Promise.all([refreshLive(),loadAll()]);
    }
  },1000);
}
function updateCountdown(){
  const el=document.getElementById('refreshCountdown');
  if(el) el.textContent=autoRefresh?'↻ '+refreshSecs+'s':'';
}
function toggleAutoRefresh(){
  autoRefresh=!autoRefresh;
  const btn=document.getElementById('autoRefreshBtn');
  if(btn) btn.classList.toggle('active',autoRefresh);
  if(autoRefresh) startRefreshTimer();
  else{clearInterval(refreshTimer);const el=document.getElementById('refreshCountdown');if(el)el.textContent='';}
}

// ── UTM Builder ──────────────────────────────────────────────
function buildUtm(){
  const base=(document.getElementById('utmBase')||{}).value||'https://eli6movies.vercel.app';
  const source=(document.getElementById('utmSource')||{}).value||'';
  const medium=(document.getElementById('utmMedium')||{}).value||'';
  const campaign=(document.getElementById('utmCampaign')||{}).value||'';
  const content=(document.getElementById('utmContent')||{}).value||'';
  if(!source){document.getElementById('utmResult').textContent='Fill in at least Source.';return;}
  const p=new URLSearchParams();
  if(source)  p.set('utm_source',source);
  if(medium)  p.set('utm_medium',medium);
  if(campaign)p.set('utm_campaign',campaign);
  if(content) p.set('utm_content',content);
  const url=base+(base.includes('?')?'&':'?')+p.toString();
  document.getElementById('utmResult').textContent=url;
}
function copyUtm(){
  const val=(document.getElementById('utmResult')||{}).textContent||'';
  if(!val||val==='Fill in at least Source.') return;
  navigator.clipboard.writeText(val).then(()=>{
    const btn=document.getElementById('utmCopyBtn');
    if(btn){btn.textContent='✓ Copied!';setTimeout(()=>btn.textContent='Copy',1500);}
  }).catch(()=>{});
}

        <button class="tab" data-tab="authlog">Auth Log</button>
      </div>
      <div class="tab-panel active" id="tab-pageviews">
        <div class="table-wrap">
          <table>
            <thead><tr><th>IP</th><th>User</th><th>Page</th><th>Country</th><th>Browser / OS</th><th>Device</th><th>Referrer</th><th>Duration</th><th>When</th></tr></thead>
            <tbody id="recentBody"><tr><td colspan="9" class="empty">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="tab-panel" id="tab-authlog">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Time</th><th>Event</th><th>Username</th><th>Email</th><th>IP</th><th>User Agent</th></tr></thead>
            <tbody id="authBody"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- UTM BUILDER -->
  <div id="section-utm" style="margin-top:4px">
    <div class="section-label">UTM Builder</div>
    <div class="utm-card">
      <div class="chart-title">Generate UTM Campaign Link</div>
      <div class="utm-base-row" style="margin-top:12px">
        <div class="utm-field">
          <label>Base URL</label>
          <input id="utmBase" placeholder="https://eli6movies.vercel.app" oninput="buildUtm()"/>
        </div>
      </div>
      <div class="utm-grid">
        <div class="utm-field">
          <label>Source <span style="color:var(--red)">*</span></label>
          <input id="utmSource" placeholder="reddit, google, newsletter…" oninput="buildUtm()"/>
        </div>
        <div class="utm-field">
          <label>Medium</label>
          <input id="utmMedium" placeholder="social, cpc, email…" oninput="buildUtm()"/>
        </div>
        <div class="utm-field">
          <label>Campaign</label>
          <input id="utmCampaign" placeholder="summer-launch, promo…" oninput="buildUtm()"/>
        </div>
        <div class="utm-field">
          <label>Content</label>
          <input id="utmContent" placeholder="banner-a, link-top…" oninput="buildUtm()"/>
        </div>
      </div>
      <div class="utm-url-row">
        <div class="utm-url-box" id="utmResult" style="color:var(--muted2)">Fill in Source to generate link…</div>
        <button class="utm-copy-btn" id="utmCopyBtn" onclick="copyUtm()">Copy</button>
      </div>
      <div style="margin-top:10px;font-size:.72rem;color:var(--muted2)">
        Tip: share this link in your Reddit posts, Discord, social media, or emails. The campaign will appear in the Acquisition section above within minutes.
      </div>
    </div>
  </div>

  <!-- USERS -->
  <div id="section-users" style="margin-top:4px">
    <div class="section-label">User Management</div>
    <div class="table-card">
      <div class="table-head">
        <div class="table-head-left">
          <span class="chart-title" style="margin:0">All Users</span>
          <span id="usersStats" style="font-size:.72rem;color:var(--muted)"></span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <div class="search-bar">
            <input class="search-input" id="userSearch" placeholder="Search email or username…"/>
          </div>
          <select id="userRoleFilter" class="search-input" style="width:auto;cursor:pointer;padding:6px 10px">
            <option value="">All roles</option>
            <option value="user">Users only</option>
            <option value="admin">Admins only</option>
          </select>
          <button class="btn-icon" id="refreshUsersBtn">↻ Refresh</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th>Role</th>
              <th>My List</th>
              <th>History</th>
              <th>Joined</th>
              <th>Change Role</th>
            </tr>
          </thead>
          <tbody id="usersBody">
            <tr><td colspan="7" class="empty" style="padding:24px;text-align:center">Click the <strong>Users</strong> tab above to load</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>`;

  // Tab switching
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    });
  });

  // Chart type toggles
  document.getElementById('chartTypeToggles')?.addEventListener('click',e=>{
    const btn=e.target.closest('[data-type]');
    if(!btn) return;
    mainChartMode=btn.dataset.type;
    document.querySelectorAll('#chartTypeToggles .chart-toggle').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    loadChart();
  });

  // Dataset toggles
  document.getElementById('datasetToggles')?.addEventListener('click',e=>{
    const btn=e.target.closest('[data-ds]');
    if(!btn) return;
    mainChartDataset=btn.dataset.ds;
    document.querySelectorAll('#datasetToggles .chart-toggle').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    loadChart();
  });
}

// ── Section nav scroll ────────────────────────────────────────
document.querySelector('.section-nav').addEventListener('click',e=>{
  const btn=e.target.closest('[data-section]');
  if(!btn) return;
  document.querySelectorAll('.snav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const el=document.getElementById('section-'+btn.dataset.section);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  if(btn.dataset.section==='users' && !adminUsersLoaded) loadAdminUsers();
});

// Highlight section nav on scroll
function onScroll(){
  const sections=['overview','audience','acquisition','content','activity','utm','users'];
  for(const id of [...sections].reverse()){
    const el=document.getElementById('section-'+id);
    if(!el) continue;
    if(el.getBoundingClientRect().top<=120){
      document.querySelectorAll('.snav-btn').forEach(b=>b.classList.toggle('active',b.dataset.section===id));
      break;
    }
  }
}
window.addEventListener('scroll',onScroll,{passive:true});

// ── Range tabs ────────────────────────────────────────────────
document.getElementById('rangeTabs').addEventListener('click',async e=>{
  const btn=e.target.closest('button[data-range]');
  if(!btn) return;
  document.querySelectorAll('.range-tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentRange=btn.dataset.range;
  refreshSecs=30;
  await loadAll();
});

// ── Controls ──────────────────────────────────────────────────
document.getElementById('autoRefreshBtn').addEventListener('click',toggleAutoRefresh);
document.getElementById('exportBtn').addEventListener('click',exportCSV);

// ── Migrate / Debug IP (wired after renderShell) ──────────────
async function runMigration(){
  const btn=document.getElementById('migrateBtn');
  if(!btn) return;
  btn.disabled=true; btn.textContent='🔄 Running…';
  try{
    const r=await fetch(API+'/admin/analytics/migrate',{method:'POST',credentials:'include'});
    const d=await r.json();
    btn.textContent='✓ Done';
    alert(`Migration complete!\n• Referrers fixed: ${d.referrersFixed}\n• Records geo-enriched: ${d.geoEnriched}\n\n${d.note}`);
    await loadRecent();
  }catch(e){
    btn.textContent='✗ Failed';
    alert('Migration failed: '+(e.message||e));
  }finally{
    setTimeout(()=>{if(btn)btn.textContent='🔧 Fix Historical Data';btn&&(btn.disabled=false);},3000);
  }
}

async function debugIp(){
  const btn=document.getElementById('debugIpBtn');
  if(!btn) return;
  btn.disabled=true; btn.textContent='🔄 Fetching…';
  try{
    const r=await fetch(API+'/admin/analytics/debug-ip',{credentials:'include'});
    const d=await r.json();
    const lines=Object.entries(d).map(([k,v])=>`${k}: ${v??'—'}`).join('\n');
    alert('IP headers the backend sees:\n\n'+lines);
  }catch(e){ alert('Failed: '+(e.message||e)); }
  finally{ btn.disabled=false; btn.textContent='🔍 Debug IP'; }
}

// ── User management ───────────────────────────────────────────
let adminUsersData = [];
let adminUsersFiltered = [];
let adminUsersLoaded = false;

async function loadAdminUsers(){
  const tbody = document.getElementById('usersBody');
  if(tbody) tbody.innerHTML = '<tr><td colspan="7" style="padding:32px;text-align:center"><div class="spinner" style="margin:0 auto"></div></td></tr>';
  try{
    const data = await api('/admin/users');
    adminUsersData = data;
    adminUsersFiltered = data;
    renderAdminUsersTable(data);
    const admins = data.filter(u=>u.role==='admin').length;
    const statsEl = document.getElementById('usersStats');
    if(statsEl) statsEl.innerHTML = `&nbsp;— ${fmt(data.length)} total · <span style="color:var(--accent)">${admins} admin${admins!==1?'s':''}</span>`;
    adminUsersLoaded = true;
  }catch(e){
    if(tbody) tbody.innerHTML = `<tr><td colspan="7" class="empty" style="padding:20px">Failed to load: ${esc(e.message)}</td></tr>`;
  }
}

function renderAdminUsersTable(users){
  const tbody = document.getElementById('usersBody');
  if(!tbody) return;
  if(!users.length){tbody.innerHTML='<tr><td colspan="7" class="empty" style="padding:20px">No users found</td></tr>';return;}
  tbody.innerHTML = users.map(u=>{
    const initial = esc((u.username||u.email||'?')[0].toUpperCase());
    const isAdmin = u.role==='admin';
    return `<tr>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:28px;height:28px;border-radius:50%;background:${isAdmin?'var(--accent)':'var(--surface3)'};border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;color:${isAdmin?'#fff':'var(--muted)'}">${initial}</div>
          <span style="font-weight:600">${esc(u.username||'—')}</span>
        </div>
      </td>
      <td style="color:var(--muted);font-size:.75rem">${esc(u.email||'—')}</td>
      <td><span class="badge ${isAdmin?'login':'user-row'}" id="ubadge-${esc(u._id)}">${esc(u.role||'user')}</span></td>
      <td style="color:var(--muted2)">${(u.myList||[]).length}</td>
      <td style="color:var(--muted2)">${(u.watchHistory||[]).length}</td>
      <td class="time-cell">${u.createdAt?new Date(u.createdAt).toLocaleDateString():'—'}</td>
      <td>
        <select data-uid="${esc(u._id)}" data-prev="${esc(u.role||'user')}"
          style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:6px;font-size:.75rem;cursor:pointer;outline:none"
          onchange="changeAdminRole(this)">
          <option value="user" ${u.role!=='admin'?'selected':''}>user</option>
          <option value="admin" ${u.role==='admin'?'selected':''}>admin</option>
        </select>
      </td>
    </tr>`;
  }).join('');
}

function filterAdminUsers(){
  const q = (document.getElementById('userSearch')||{}).value?.toLowerCase()||'';
  const role = (document.getElementById('userRoleFilter')||{}).value||'';
  adminUsersFiltered = adminUsersData.filter(u=>{
    const matchQ = !q||(u.username||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q);
    const matchR = !role||(u.role||'user')===role;
    return matchQ && matchR;
  });
  renderAdminUsersTable(adminUsersFiltered);
}

async function changeAdminRole(sel){
  const id = sel.dataset.uid;
  const role = sel.value;
  const prev = sel.dataset.prev;
  if(role === prev) return;
  sel.disabled = true;
  try{
    const r = await fetch(API+'/admin/users/'+id+'/role',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      credentials:'include',
      body:JSON.stringify({role}),
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    sel.dataset.prev = role;
    // Update in-memory record
    const u = adminUsersData.find(u=>String(u._id)===String(id));
    if(u) u.role = role;
    // Update badge
    const badge = document.getElementById('ubadge-'+id);
    if(badge){badge.textContent=role;badge.className='badge '+(role==='admin'?'login':'user-row');}
    // Refresh stats
    const admins = adminUsersData.filter(u=>u.role==='admin').length;
    const statsEl = document.getElementById('usersStats');
    if(statsEl) statsEl.innerHTML = `&nbsp;— ${fmt(adminUsersData.length)} total · <span style="color:var(--accent)">${admins} admin${admins!==1?'s':''}</span>`;
  }catch(e){
    sel.value = prev;
    alert('Failed to update role: '+e.message);
  }finally{
    sel.disabled = false;
  }
}

// ── Boot ──────────────────────────────────────────────────────
(async()=>{
  showWaking(1);
  const ok=await checkAuth();
  if(!ok) return;

  renderShell();
  await loadAll();

  // Wire up dynamic buttons rendered by renderShell
  document.getElementById('migrateBtn')?.addEventListener('click', runMigration);
  document.getElementById('debugIpBtn')?.addEventListener('click', debugIp);
  document.getElementById('refreshUsersBtn')?.addEventListener('click', loadAdminUsers);
  document.getElementById('userSearch')?.addEventListener('input', filterAdminUsers);
  document.getElementById('userRoleFilter')?.addEventListener('change', filterAdminUsers);

  // Live every 5s
  setInterval(refreshLive,5000);
  // Start countdown
  const btn=document.getElementById('autoRefreshBtn');
  if(btn) btn.classList.add('active');
  startRefreshTimer();
})();
</script>
