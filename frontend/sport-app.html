<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Sport — ELI6 Movies</title>
  <!-- Vercel rewrites /app/sport → /sport-app.html server-side, so the browser URL
       stays at /app/sport and relative paths would resolve to /app/css/... and 404.
       The base href forces every relative path to resolve from /. -->
  <base href="/" />

  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('eli6.prefs') || '{}');
        document.documentElement.dataset.theme = p.theme || 'pulse';
        document.documentElement.dataset.mode  = p.mode  || 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'pulse';
        document.documentElement.dataset.mode  = 'dark';
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/sport-app.css" />

  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ELI6 Sport" />
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
</head>
<body class="sportapp">

  <!-- LIST VIEW -->
  <section id="view-list" class="view view--list" aria-hidden="false">
    <header class="sa-top">
      <div class="sa-top__row">
        <h1 class="sa-top__title">Sport</h1>
        <button class="sa-icon sa-search-toggle" type="button" aria-label="Search" data-action="toggle-search">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="sa-icon sa-fav-toggle" type="button" aria-label="Favorites only" data-action="toggle-fav-only" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 17.3l-5.5 3.2 1.5-6.2L3 9.9l6.3-.5L12 3.6l2.7 5.8 6.3.5-5 4.4 1.5 6.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="sa-search" hidden>
        <input type="search" id="sa-search-input" placeholder="Search matches, leagues, teams…" autocomplete="off" />
      </div>

      <nav class="sa-datestrip" aria-label="Date">
        <button class="sa-date" data-date="yesterday" type="button">Yesterday</button>
        <button class="sa-date is-active" data-date="today" type="button">Today</button>
        <button class="sa-date" data-date="tomorrow" type="button">Tomorrow</button>
      </nav>

      <nav class="sa-sports" id="sa-sports" aria-label="Sport"></nav>
    </header>

    <main class="sa-body" id="sa-body">
      <div class="sa-skeleton" id="sa-skeleton">
        <div class="sa-skeleton__row"></div>
        <div class="sa-skeleton__row"></div>
        <div class="sa-skeleton__row"></div>
        <div class="sa-skeleton__row"></div>
        <div class="sa-skeleton__row"></div>
      </div>
    </main>
  </section>

  <!-- DETAIL VIEW (mirrors watch-app.html structure) -->
  <section id="view-detail" class="view view--detail" aria-hidden="true" hidden>

    <div class="stage" id="sa-stage">
      <button class="stage__back" type="button" data-action="back" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <iframe id="sa-frame" class="stage__iframe"
              allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
              allowfullscreen
              referrerpolicy="origin"></iframe>
      <div class="stage__placeholder" id="sa-placeholder">
        <div class="stage__spinner"></div>
        <div id="sa-placeholderText">Loading stream…</div>
      </div>
    </div>

    <div class="content">
      <h1 class="title" id="sa-title">—</h1>
      <div class="meta-row" id="sa-meta"></div>
      <div class="genres" id="sa-genres"></div>

      <div class="actions">
        <button class="action action--primary" type="button" data-action="toggle-fav-team" id="sa-favBtn" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17.3l-5.5 3.2 1.5-6.2L3 9.9l6.3-.5L12 3.6l2.7 5.8 6.3.5-5 4.4 1.5 6.2z" fill="currentColor"/></svg>
          <span id="sa-favBtnLabel">Favorite</span>
        </button>
        <button class="action" type="button" data-action="share">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a3 3 0 1 0-2.83-4H15a3 3 0 0 0 0 6 3 3 0 0 0 2.83-2zM6 14a3 3 0 1 1 2.83-4 3 3 0 0 1 0 4zm12 6a3 3 0 1 1 0-6 3 3 0 0 1 0 6z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span>Share</span>
        </button>
        <button class="action" type="button" data-action="reload" aria-label="Reload">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.4L21 3v6h-6l2.6-2.6A7 7 0 1 0 19 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Reload</span>
        </button>
      </div>

      <div class="server-bar">
        <select class="server-select" id="sa-server-select" aria-label="Stream source"></select>
        <button class="server-next" type="button" data-action="next-source" aria-label="Try next source">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l10 8-10 8V4zM17 5h2v14h-2z" fill="currentColor"/></svg>
          <span>Next</span>
        </button>
      </div>
    </div>

    <div class="sources-pane">
      <div class="sources-pane__head">
        <div class="section-h">All streams</div>
        <div class="sa-langbar" id="sa-langbar"></div>
      </div>
      <ul class="sa-sources" id="sa-sources"></ul>
    </div>

    <div class="toast" id="sa-toast"></div>
  </section>

  <script src="js/config.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/sport-app.js" defer></script>
</body>
</html>
