<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sport — ELI6 Movies</title>

  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('eli6.prefs') || '{}');
        document.documentElement.dataset.theme = p.theme || 'pulse';
        document.documentElement.dataset.mode  = p.mode  || 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'pulse';
        document.documentElement.dataset.mode  = 'dark';
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/sport-app.css" />

  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ELI6 Sport" />
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
</head>
<body class="sportapp">

  <!-- LIST VIEW -->
  <section id="view-list" class="view view--list" aria-hidden="false">
    <header class="sa-top">
      <div class="sa-top__row">
        <h1 class="sa-top__title">Sport</h1>
        <button class="sa-icon sa-search-toggle" type="button" aria-label="Search" data-action="toggle-search">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="sa-icon sa-fav-toggle" type="button" aria-label="Favorites only" data-action="toggle-fav-only" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 17.3l-5.5 3.2 1.5-6.2L3 9.9l6.3-.5L12 3.6l2.7 5.8 6.3.5-5 4.4 1.5 6.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="sa-search" hidden>
        <input type="search" id="sa-search-input" placeholder="Search matches, leagues, teams…" autocomplete="off" />
      </div>

      <nav class="sa-datestrip" aria-label="Date">
        <button class="sa-date" data-date="yesterday" type="button">Yesterday</button>
        <button class="sa-date is-active" data-date="today" type="button">Today</button>
        <button class="sa-date" data-date="tomorrow" type="button">Tomorrow</button>
      </nav>

      <nav class="sa-sports" id="sa-sports" aria-label="Sport"></nav>
    </header>

    <main class="sa-body" id="sa-body">
      <div class="sa-skeleton" id="sa-skeleton">
        <div class="sa-skeleton__row"></div>
        <div class="sa-skeleton__row"></div>
        <div class="sa-skeleton__row"></div>
        <div class="sa-skeleton__row"></div>
        <div class="sa-skeleton__row"></div>
      </div>
    </main>
  </section>

  <!-- DETAIL VIEW -->
  <section id="view-detail" class="view view--detail" aria-hidden="true" hidden>
    <header class="sa-detail-head">
      <button class="sa-icon sa-back" type="button" data-action="back" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="sa-detail-head__title" id="sa-detail-title">—</div>
      <button class="sa-icon sa-fav-match" type="button" data-action="toggle-fav-team" aria-pressed="false" aria-label="Favorite this match">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 17.3l-5.5 3.2 1.5-6.2L3 9.9l6.3-.5L12 3.6l2.7 5.8 6.3.5-5 4.4 1.5 6.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="sa-hero" id="sa-detail-hero"></div>
    <div class="sa-meta" id="sa-detail-meta"></div>

    <div class="sa-sources-head">
      <h2>Streams</h2>
      <div class="sa-langbar" id="sa-langbar"></div>
    </div>

    <ul class="sa-sources" id="sa-sources"></ul>

    <div class="sa-detail-footnote">
      Taps on a stream open the native fullscreen player.
    </div>
  </section>

  <script src="js/config.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/sport-app.js" defer></script>
</body>
</html>
