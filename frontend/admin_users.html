<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>User Management - Admin Panel</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 20px;
            }

            .container {
                max-width: 1200px;
                margin: 0 auto;
                background: white;
                border-radius: 15px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
                overflow: hidden;
            }

            .header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 30px;
                text-align: center;
            }

            .header h1 {
                font-size: 2.5rem;
                margin-bottom: 10px;
            }

            .header p {
                font-size: 1.1rem;
                opacity: 0.9;
            }

            .content {
                padding: 30px;
            }

            .stats {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
                margin-bottom: 30px;
            }

            .stat-card {
                background: #f8f9fa;
                padding: 20px;
                border-radius: 10px;
                text-align: center;
                border-left: 4px solid #667eea;
            }

            .stat-number {
                font-size: 2rem;
                font-weight: bold;
                color: #667eea;
            }

            .stat-label {
                color: #6c757d;
                margin-top: 5px;
            }

            .controls {
                display: flex;
                gap: 15px;
                margin-bottom: 20px;
                flex-wrap: wrap;
            }

            .btn {
                padding: 10px 20px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                font-size: 1rem;
                transition: all 0.3s ease;
                text-decoration: none;
                display: inline-block;
            }

            .btn-primary {
                background: #667eea;
                color: white;
            }

            .btn-primary:hover {
                background: #5a6fd8;
                transform: translateY(-2px);
            }

            .btn-secondary {
                background: #6c757d;
                color: white;
            }

            .btn-secondary:hover {
                background: #5a6268;
            }

            .search-box {
                flex: 1;
                min-width: 200px;
                padding: 10px 15px;
                border: 2px solid #e9ecef;
                border-radius: 8px;
                font-size: 1rem;
                transition: border-color 0.3s ease;
            }

            .search-box:focus {
                outline: none;
                border-color: #667eea;
            }

            .users-table {
                width: 100%;
                border-collapse: collapse;
                background: white;
                border-radius: 10px;
                overflow: hidden;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            }

            .users-table th {
                background: #f8f9fa;
                padding: 15px;
                text-align: left;
                font-weight: 600;
                color: #495057;
                border-bottom: 2px solid #e9ecef;
            }

            .users-table td {
                padding: 15px;
                border-bottom: 1px solid #e9ecef;
                vertical-align: top;
            }

            .users-table tr:hover {
                background: #f8f9fa;
            }

            .user-avatar {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-weight: bold;
                font-size: 1.1rem;
            }

            .user-info h4 {
                color: #495057;
                margin-bottom: 5px;
            }

            .user-info p {
                color: #6c757d;
                font-size: 0.9rem;
            }

            .user-stats {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }

            .stat-badge {
                background: #e9ecef;
                color: #495057;
                padding: 4px 8px;
                border-radius: 15px;
                font-size: 0.8rem;
                font-weight: 500;
            }

            .admin-badge {
                background: #dc3545;
                color: white;
            }

            .btn-danger {
                background: #dc3545;
                color: white;
            }

            .btn-danger:hover {
                background: #c82333;
            }

            .loading {
                text-align: center;
                padding: 50px;
                color: #6c757d;
            }

            .error {
                background: #f8d7da;
                color: #721c24;
                padding: 15px;
                border-radius: 8px;
                margin-bottom: 20px;
                border: 1px solid #f5c6cb;
            }

            .success {
                background: #d4edda;
                color: #155724;
                padding: 15px;
                border-radius: 8px;
                margin-bottom: 20px;
                border: 1px solid #c3e6cb;
            }

            @media (max-width: 768px) {
                .container {
                    margin: 10px;
                    border-radius: 10px;
                }

                .header {
                    padding: 20px;
                }

                .header h1 {
                    font-size: 2rem;
                }

                .content {
                    padding: 20px;
                }

                .users-table {
                    font-size: 0.9rem;
                }

                .users-table th,
                .users-table td {
                    padding: 10px;
                }

                .controls {
                    flex-direction: column;
                }

                .search-box {
                    min-width: auto;
                }
            }
        </style>
    </head>

    <body>
        <div
            id="adminLoginContainer"
            style="
                display: none;
                max-width: 400px;
                margin: 60px auto;
                background: white;
                padding: 32px 24px;
                border-radius: 12px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            "
        >
            <h2 style="text-align: center; margin-bottom: 20px">Admin Login</h2>
            <form id="adminLoginForm">
                <label
                    >Email<br /><input
                        type="email"
                        id="adminLoginEmail"
                        required
                        style="width: 100%; padding: 10px; margin: 8px 0 16px 0"
                /></label>
                <label
                    >Password<br /><input
                        type="password"
                        id="adminLoginPassword"
                        required
                        style="width: 100%; padding: 10px; margin: 8px 0 16px 0"
                /></label>
                <button type="submit" class="btn btn-primary" style="width: 100%">Login</button>
            </form>
            <div id="adminLoginError" class="error" style="display: none; margin-top: 16px"></div>
        </div>
        <div class="container" id="adminPanelContainer" style="display: none">
            <div class="header">
                <h1>👥 User Management</h1>
                <p>Admin Panel - View and manage all registered users</p>
            </div>

            <div class="content">
                <div id="message"></div>

                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-number" id="totalUsers">-</div>
                        <div class="stat-label">Total Users</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="activeUsers">-</div>
                        <div class="stat-label">Active Users</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="avgMyList">-</div>
                        <div class="stat-label">Avg MyList Items</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="avgWatchHistory">-</div>
                        <div class="stat-label">Avg Watch History</div>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn btn-primary" onclick="loadUsers()">🔄 Refresh Users</button>
                    <button class="btn btn-secondary" onclick="exportUsers()">
                        📊 Export Data
                    </button>
                    <button class="btn btn-primary" onclick="addUserModal()">
                        ➕ Add New User
                    </button>
                    <button class="btn btn-secondary" onclick="bulkDeleteModal()">
                        🗑️ Bulk Delete
                    </button>
                    <select
                        id="roleFilter"
                        onchange="filterUsers()"
                        style="padding: 10px; border-radius: 8px; border: 2px solid #e9ecef"
                    >
                        <option value="">All Roles</option>
                        <option value="user">Users Only</option>
                        <option value="admin">Admins Only</option>
                    </select>
                    <input
                        type="text"
                        class="search-box"
                        id="searchBox"
                        placeholder="Search users by name or email..."
                        onkeyup="filterUsers()"
                    />
                </div>

                <div id="usersContainer">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modals -->
        <div
            id="modal"
            style="
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.5);
                z-index: 9999;
                align-items: center;
                justify-content: center;
            "
        >
            <div
                id="modalContent"
                style="
                    background: white;
                    padding: 30px 20px 20px 20px;
                    border-radius: 12px;
                    max-width: 95vw;
                    width: 400px;
                    position: relative;
                    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
                "
            >
                <button
                    onclick="closeModal()"
                    style="
                        position: absolute;
                        top: 10px;
                        right: 10px;
                        background: none;
                        border: none;
                        font-size: 1.5rem;
                        cursor: pointer;
                    "
                >
                    &times;
                </button>
                <div id="modalBody"></div>
            </div>
        </div>

        <!-- external script only; single source of truth -->
        <script src="/js/admin_users.v3.js" defer></script>
    </body>
</html>
