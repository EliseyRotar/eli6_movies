<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Shows — ELI6 Movies</title>

  <script>
    (function(){
      try {
        var p = JSON.parse(localStorage.getItem('eli6.prefs') || '{}');
        document.documentElement.dataset.theme = p.theme || 'pulse';
        document.documentElement.dataset.mode  = p.mode  || 'dark';
      } catch(e) {
        document.documentElement.dataset.theme = 'pulse';
        document.documentElement.dataset.mode  = 'dark';
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Major+Mono+Display&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/design.css" />
</head>
<body>
  <div class="app">
    <div id="topnav-mount"></div>

    <div class="pagehead">
      <div class="pagehead__eyebrow" data-i18n="common.browse">Browse</div>
      <h1 class="pagehead__title" data-i18n="tvshows.title">TV Shows</h1>
      <p class="pagehead__sub" data-i18n="tvshows.subtitle">Series, miniseries, and documentaries — all in one place.</p>
    </div>

    <div id="pills-mount"></div>
    <div id="rows-mount"></div>
    <div id="footer-mount"></div>
  </div>

  <div id="bottomnav-mount"></div>

  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/mylist.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/tvshows.js"></script>
</body>
</html>
