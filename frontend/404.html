<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — ELI6 Movies</title>

  <script>
    (function(){
      try {
        var p = JSON.parse(localStorage.getItem('eli6.prefs') || '{}');
        document.documentElement.dataset.theme = p.theme || 'pulse';
        document.documentElement.dataset.mode  = p.mode  || 'dark';
      } catch(e) {
        document.documentElement.dataset.theme = 'pulse';
        document.documentElement.dataset.mode  = 'dark';
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Major+Mono+Display&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/design.css" />

  <style>
    .e404 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
    }

    /* subtle radial glow behind the number */
    .e404::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--accent) 18%, transparent) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -55%);
      pointer-events: none;
    }

    html[data-theme="marquee"] .e404::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px);
      pointer-events: none;
      z-index: 0;
    }

    .e404__inner {
      position: relative;
      z-index: 1;
      animation: e6-rise 500ms cubic-bezier(0.22,1,0.36,1) both;
    }

    .e404__code {
      font-family: var(--font-head);
      font-size: clamp(100px, 20vw, 200px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--fg);
      margin-bottom: 0;
      /* accent on the middle zero */
    }
    .e404__code .accent { color: var(--accent); }

    html[data-theme="marquee"] .e404__code {
      font-family: var(--font-mono);
      letter-spacing: -0.02em;
    }

    .e404__eyebrow {
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 20px;
    }
    html[data-theme="marquee"] .e404__eyebrow { font-family: var(--font-mono); }

    .e404__title {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 600;
      color: var(--fg);
      margin: 16px 0 10px;
    }

    .e404__sub {
      font-size: 15px;
      color: var(--fg-muted);
      max-width: 420px;
      line-height: 1.6;
      margin: 0 auto 36px;
    }

    .e404__actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .e404__links {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 40px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    .e404__link {
      font-size: 13px;
      color: var(--fg-muted);
      text-decoration: none;
      transition: color 150ms;
    }
    .e404__link:hover { color: var(--fg); }

    html[data-theme="marquee"] .e404__link {
      font-family: var(--font-mono);
      font-size: 12px;
    }
    html[data-theme="marquee"] .e404__link:hover { color: var(--accent); }

    /* film-strip decoration */
    .e404__strip {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 32px;
      opacity: 0.35;
    }
    .e404__strip span {
      width: 14px; height: 20px;
      border: 1.5px solid var(--fg-muted);
      border-radius: 2px;
    }
    html[data-theme="marquee"] .e404__strip span {
      border-color: var(--accent);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <script src="js/config.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/i18n.js" defer></script>

  <div id="topnav-mount"></div>

  <main class="e404">
    <div class="e404__inner">

      <div class="e404__strip" aria-hidden="true">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>

      <p class="e404__eyebrow">Error</p>

      <div class="e404__code" aria-label="404">
        4<span class="accent">0</span>4
      </div>

      <h1 class="e404__title">This scene got cut</h1>
      <p class="e404__sub">
        The page you're looking for doesn't exist, was removed,<br>
        or maybe it never made the final cut.
      </p>

      <div class="e404__actions">
        <a href="index.html" class="btn btn--primary">← Back to home</a>
        <a href="search.html" class="btn btn--ghost">Search titles</a>
      </div>

      <nav class="e404__links" aria-label="Quick links">
        <a class="e404__link" href="movies.html">Movies</a>
        <a class="e404__link" href="tvshows.html">TV Shows</a>
        <a class="e404__link" href="anime.html">Anime</a>
        <a class="e404__link" href="mylist.html">My List</a>
      </nav>

    </div>
  </main>

  <div id="bottomnav-mount"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof renderTopNav    === 'function') renderTopNav('');
      if (typeof renderBottomNav === 'function') renderBottomNav('');
    });
  </script>
</body>
</html>
