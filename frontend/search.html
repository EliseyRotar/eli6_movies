<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search — ELI6 Movies</title>

  <script>
    (function(){
      try {
        var p = JSON.parse(localStorage.getItem('eli6.prefs') || '{}');
        document.documentElement.dataset.theme = p.theme || 'pulse';
        document.documentElement.dataset.mode  = p.mode  || 'dark';
      } catch(e) {
        document.documentElement.dataset.theme = 'pulse';
        document.documentElement.dataset.mode  = 'dark';
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Major+Mono+Display&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/design.css" />
</head>
<body>
  <div class="app">
    <div id="topnav-mount"></div>

    <div class="search-bar">
      <span class="search-icon">⌕</span>
      <input
        class="search-input"
        id="search-input"
        type="search"
        placeholder="Search films, shows, anime…"
        autofocus
      />
    </div>

    <div class="search-count" id="search-count"></div>

    <div id="pills-mount"></div>
    <div id="results-mount"></div>
    <div id="footer-mount"></div>
  </div>

  <div id="bottomnav-mount"></div>

  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/components.js"></script>
  <script src="js/mylist.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
