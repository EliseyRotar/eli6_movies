<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Sports — ELI6 Movies</title>

  <script>
    (function(){
      try {
        var p = JSON.parse(localStorage.getItem('eli6.prefs') || '{}');
        document.documentElement.dataset.theme = p.theme || 'pulse';
        document.documentElement.dataset.mode  = p.mode  || 'dark';
      } catch(e) {
        document.documentElement.dataset.theme = 'pulse';
        document.documentElement.dataset.mode  = 'dark';
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Major+Mono+Display&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/design.css" />

  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ELI6 Live" />
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div class="app">
    <div id="topnav-mount"></div>

    <div class="pagehead">
      <div class="pagehead__eyebrow" data-i18n="live.page.eyebrow">Live</div>
      <h1 class="pagehead__title" data-i18n="live.page.title">Sports</h1>
      <p class="pagehead__sub" data-i18n="live.page.subtitle">Live matches and today's schedule — football, NBA, NFL, F1, and more.</p>
    </div>

    <div id="live-date-mount"></div>
    <div id="sport-tabs-mount"></div>
    <div id="live-league-mount"></div>
    <div id="live-search-mount"></div>
    <div id="live-refresh-mount"></div>
    <div id="matches-mount"></div>

    <div id="footer-mount"></div>
  </div>

  <div id="bottomnav-mount"></div>

  <script src="js/config.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/live.js" defer></script>
</body>
</html>
