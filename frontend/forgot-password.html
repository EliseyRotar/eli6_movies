<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — ELI6 Movies</title>
  <script>
    (function(){
      try { var p=JSON.parse(localStorage.getItem('eli6.prefs')||'{}'); document.documentElement.dataset.theme=p.theme||'pulse'; document.documentElement.dataset.mode=p.mode||'dark'; }
      catch(e){ document.documentElement.dataset.theme='pulse'; document.documentElement.dataset.mode='dark'; }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/design.css" />
  <style>
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; }
    .auth-logo { font-size: 22px; font-weight: 800; color: var(--fg); margin-bottom: 28px; }
    .auth-logo span { color: var(--accent); }
    .auth-title { font-size: 22px; font-weight: 700; color: var(--fg); margin: 0 0 8px; }
    .auth-sub { font-size: 14px; color: var(--fg-muted); margin: 0 0 28px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--fg); }
    .field input { background: var(--surface2,#1e1e24); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--fg); font-size: 14px; outline: none; }
    .field input:focus { border-color: var(--accent); }
    .btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .msg { font-size: 13px; padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .msg.success { background: rgba(0,184,148,.15); color: #00b894; border: 1px solid rgba(0,184,148,.3); }
    .msg.error   { background: rgba(225,112,85,.15);  color: #e17055; border: 1px solid rgba(225,112,85,.3); }
    .back-link { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: var(--fg-muted); text-decoration: none; }
    .back-link:hover { color: var(--fg); }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">ELI<span>6</span>.</div>
      <h1 class="auth-title">Forgot password?</h1>
      <p class="auth-sub">Enter your email and we'll send you a reset link.</p>
      <div id="msg" class="msg"></div>
      <form id="form">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <button type="submit" class="btn-primary" id="btn">Send reset link</button>
      </form>
      <a href="account.html" class="back-link">← Back to sign in</a>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script>
    const API = (window.API_BASE_URL || 'https://eli6movies.onrender.com/api').replace(/\/+$/, '');
    const form = document.getElementById('form');
    const btn  = document.getElementById('btn');
    const msg  = document.getElementById('msg');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + type;
      msg.style.display = 'block';
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return;
      btn.disabled = true;
      btn.textContent = 'Sending…';
      msg.style.display = 'none';
      try {
        const r = await fetch(API + '/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const d = await r.json();
        if (r.status === 429) {
          showMsg('Too many requests. Please wait a few minutes.', 'error');
        } else {
          showMsg('If that email exists, a reset link has been sent. Check your inbox.', 'success');
          form.reset();
        }
      } catch (_) {
        showMsg('Something went wrong. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send reset link';
      }
    });
  </script>
</body>
</html>
