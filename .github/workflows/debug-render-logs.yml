name: Debug Render Logs
on:
  workflow_dispatch:
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Render deploy status
        run: |
          echo "=== Latest Deploys ==="
          curl -s "https://api.render.com/v1/services/srv-d8arhovavr4c73dsbeb0/deploys?limit=5" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | python3 -c "
import json,sys
data=json.load(sys.stdin)
for item in data:
  d=item.get('deploy',item)
  print(d.get('status'), '|', d.get('commit',{}).get('id','?')[:10], '|', d.get('commit',{}).get('message','?')[:60])
  print('  started:', d.get('startedAt'), 'finished:', d.get('finishedAt'))
"
