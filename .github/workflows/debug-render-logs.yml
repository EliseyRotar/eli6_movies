name: Debug Render Logs
on:
  workflow_dispatch:
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch recent Render logs
        run: |
          echo "=== Service Info ==="
          curl -s "https://api.render.com/v1/services/srv-d8arhovavr4c73dsbeb0" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | python3 -m json.tool | head -40
          echo ""
          echo "=== Recent Deploys (raw) ==="
          curl -s "https://api.render.com/v1/services/srv-d8arhovavr4c73dsbeb0/deploys?limit=5" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | python3 -m json.tool | head -80
          echo ""
          echo "=== Log Stream (last 100 lines) ==="
          curl -s "https://api.render.com/v1/services/srv-d8arhovavr4c73dsbeb0/log-stream?limit=100" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | head -100 || true
