name: Debug Render Logs
on:
  workflow_dispatch:
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Render deploy logs
        run: |
          echo "=== Deploy dep-d8d11q5l15qc738usl60 logs ==="
          curl -s "https://api.render.com/v1/services/srv-d8arhovavr4c73dsbeb0/deploys/dep-d8d11q5l15qc738usl60" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | python3 -m json.tool
          echo ""
          echo "=== ALL Deploy Logs (v2 endpoint) ==="
          curl -s "https://api.render.com/v2/services/srv-d8arhovavr4c73dsbeb0/log-streams?resource=srv-d8arhovavr4c73dsbeb0&startTime=2026-05-29T22:15:00Z&endTime=2026-05-29T23:00:00Z&limit=200&text=true" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | head -200 || true
          echo ""
          echo "=== Current service logs ==="
          curl -s "https://api.render.com/v1/logs?serviceId=srv-d8arhovavr4c73dsbeb0&startTime=2026-05-29T22:00:00Z&limit=200" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | python3 -m json.tool | head -200 || true
