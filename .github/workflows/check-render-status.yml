name: Check Render Status
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest deploys
        run: |
          echo "=== Latest Deploys ==="
          curl -s "https://api.render.com/v1/services/srv-d8arhovavr4c73dsbeb0/deploys?limit=3" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | python3 -c "
import json,sys
data=json.load(sys.stdin)
for item in data:
  d=item.get('deploy',item)
  print('status:', d.get('status'))
  print('commit:', d.get('commit',{}).get('id','?')[:10], '|', d.get('commit',{}).get('message','?')[:80])
  print('started:', d.get('startedAt'), '| finished:', d.get('finishedAt'))
  print()
"
      - name: Get service info
        run: |
          echo "=== Service Status ==="
          curl -s "https://api.render.com/v1/services/srv-d8arhovavr4c73dsbeb0" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" | python3 -c "
import json,sys
d=json.load(sys.stdin)
svc=d.get('service',d)
print('name:', svc.get('name'))
print('status:', svc.get('suspended'))
print('serviceDetails:', json.dumps(svc.get('serviceDetails',{}), indent=2))
"
