name: Post Initial Status Message

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post status embed to site-status channel
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Check all services
          fe_code=$(curl -o /dev/null -s -w "%{http_code}" --max-time 8 "https://eli6movies.vercel.app")
          be_code=$(curl -o /dev/null -s -w "%{http_code}" --max-time 8 "https://eli6movies.onrender.com/api/health")
          tmdb_code=$(curl -o /dev/null -s -w "%{http_code}" --max-time 8 "https://api.themoviedb.org/3/configuration?api_key=${{ secrets.TMDB_API_KEY }}")
          jikan_code=$(curl -o /dev/null -s -w "%{http_code}" --max-time 8 "https://api.jikan.moe/v4/anime?limit=1")

          fe_ok=$([[ "$fe_code" == "200" ]] && echo "true" || echo "false")
          be_ok=$([[ "$be_code" == "200" ]] && echo "true" || echo "false")
          tmdb_ok=$([[ "$tmdb_code" == "200" ]] && echo "true" || echo "false")
          jikan_ok=$([[ "$jikan_code" == "200" ]] && echo "true" || echo "false")

          fe_icon=$([[ "$fe_ok" == "true" ]] && echo "🟢" || echo "🔴")
          be_icon=$([[ "$be_ok" == "true" ]] && echo "🟢" || echo "🔴")
          tmdb_icon=$([[ "$tmdb_ok" == "true" ]] && echo "🟢" || echo "🔴")
          jikan_icon=$([[ "$jikan_ok" == "true" ]] && echo "🟢" || echo "🔴")

          all_ok=$([[ "$fe_ok$be_ok$tmdb_ok$jikan_ok" == "truetruetruetrue" ]] && echo "true" || echo "false")
          COLOR=$([[ "$all_ok" == "true" ]] && echo "3908956" || echo "15548997")
          TITLE=$([[ "$all_ok" == "true" ]] && echo "✅ All Systems Operational" || echo "🔴 Service Disruption")

          python3 - <<PYEOF
          import urllib.request, json

          TOKEN = "${{ secrets.DISCORD_BOT_TOKEN }}"
          CHANNEL = "1511802446366642357"

          payload = {
            "embeds": [{
              "title": "$TITLE",
              "color": $COLOR,
              "fields": [
                {"name": "$fe_icon Frontend",  "value": "eli6movies.vercel.app", "inline": True},
                {"name": "$be_icon Backend",   "value": "API / Database",         "inline": True},
                {"name": "$tmdb_icon TMDB",    "value": "Movie & TV metadata",    "inline": True},
                {"name": "$jikan_icon Anime",  "value": "Jikan / MyAnimeList",    "inline": True},
              ],
              "footer": {"text": "ELI6 Movies • Auto-updated every 5 min"},
              "timestamp": "$TIMESTAMP"
            }]
          }

          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              f"https://discord.com/api/v10/channels/{CHANNEL}/messages",
              data=data,
              headers={"Content-Type": "application/json", "Authorization": f"Bot {TOKEN}"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
                  msg_id = result["id"]
                  print(f"Posted message: {msg_id}")

                  # Pin it
                  pin_req = urllib.request.Request(
                      f"https://discord.com/api/v10/channels/{CHANNEL}/pins/{msg_id}",
                      data=b"",
                      headers={"Authorization": f"Bot {TOKEN}", "Content-Length": "0"},
                      method="PUT"
                  )
                  try:
                      urllib.request.urlopen(pin_req)
                      print("Pinned!")
                  except Exception as e:
                      print(f"Pin failed: {e}")
          except Exception as e:
              print(f"Post failed: {e}")
              if hasattr(e, 'read'): print(e.read().decode())
          PYEOF
