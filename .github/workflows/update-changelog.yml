name: Update Changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

# We need to commit back to the repo and trigger the frontend deploy.
permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # No `if:` guard here. The marker check used to be
    #   if: !contains(head_commit.message, '[skip changelog]')
    # but that also matches the marker inside commit bodies, so a real
    # commit that just MENTIONS [skip changelog] in its body was being
    # skipped by accident. The loop-prevention is now handled inside
    # the generator's isSkippable(), which checks the SUBJECT only.

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run changelog generator
        run: node scripts/generate-changelog.js

      - name: Commit + push if updates.html changed
        id: commit
        run: |
          if git diff --quiet -- frontend/updates.html; then
            echo "No changelog changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'eli6 changelog bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/updates.html
          git commit -m "chore: update changelog [skip changelog]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger frontend deploy so the new changelog ships to prod
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN-authored pushes don't fire path-gated workflows by
          # default, so kick off deploy-frontend.yml explicitly.
          gh workflow run deploy-frontend.yml --ref main || true
